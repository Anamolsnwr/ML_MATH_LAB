<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ML × MATH ENGINE{% endblock %}</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-deep: #030712;
      --card-bg: rgba(17, 24, 39, 0.65);
      --card-border: rgba(255, 255, 255, 0.08);
      
      --gradient-ml: linear-gradient(135deg, #6366F1 0%, #A855F7 50%, #EC4899 100%);
      --gradient-glow: linear-gradient(135deg, rgba(99, 102, 241, 0.4), rgba(236, 72, 153, 0.4));
      
      --text-main: #F9FAFB;
      --text-muted: #9CA3AF;
      --font-display: 'Space Grotesk', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    body {
      background-color: var(--bg-deep) !important;
      color: var(--text-main) !important;
      font-family: var(--font-body);
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
    }

    /* Animated Background Glow Orbs */
    .bg-mesh {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      overflow: hidden;
    }
    .orb-1 {
      position: absolute;
      top: -10%;
      left: -10%;
      width: 50vw;
      height: 50vw;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, rgba(3, 7, 18, 0) 70%);
      filter: blur(80px);
    }
    .orb-2 {
      position: absolute;
      bottom: -10%;
      right: -10%;
      width: 50vw;
      height: 50vw;
      background: radial-gradient(circle, rgba(236, 72, 153, 0.2) 0%, rgba(3, 7, 18, 0) 70%);
      filter: blur(80px);
    }

    /* Fusion Node Glass Card */
    .fusion-node {
      background: var(--card-bg) !important;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border) !important;
      border-radius: 24px;
      position: relative;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .fusion-node:hover {
      transform: translateY(-8px) scale(1.01);
      border-color: rgba(168, 85, 247, 0.5) !important;
      box-shadow: 0 20px 40px -15px rgba(168, 85, 247, 0.3);
    }

    /* Glowing Badge Accent */
    .fusion-badge {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      letter-spacing: 1px;
      padding: 0.35rem 0.85rem;
      border-radius: 100px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #A855F7;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* Gradient Hero Text */
    .gradient-text {
      background: var(--gradient-ml);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-family: var(--font-display);
    }

    /* High Tech Glass Button */
    .btn-fusion {
      background: var(--gradient-ml);
      color: #FFFFFF !important;
      border: none;
      border-radius: 14px;
      font-weight: 700;
      padding: 0.9rem 1.8rem;
      font-family: var(--font-display);
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
      box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
    }

    .btn-fusion:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 35px -5px rgba(236, 72, 153, 0.6);
      color: #FFFFFF !important;
    }

    .btn-fusion-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #FFFFFF !important;
      border-radius: 14px;
      font-weight: 600;
      padding: 0.9rem 1.8rem;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }

    .btn-fusion-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }

    /* Inputs & Form Controls */
    .fusion-input, input.form-control, textarea.form-control {
      background: rgba(3, 7, 18, 0.8) !important;
      border: 1px solid rgba(255, 255, 255, 0.12) !important;
      color: #FFFFFF !important;
      border-radius: 12px;
      padding: 0.9rem 1.25rem;
      font-family: var(--font-mono);
      transition: all 0.25s ease;
    }

    .fusion-input:focus, input.form-control:focus, textarea.form-control:focus {
      border-color: #A855F7 !important;
      box-shadow: 0 0 0 4px rgba(168, 85, 247, 0.25) !important;
    }

    /* Output Console */
    .output-box {
      background: #02040A !important;
      border: 1px solid rgba(168, 85, 247, 0.3) !important;
      border-radius: 16px;
      padding: 1.25rem;
      min-height: 140px;
      font-family: var(--font-mono);
      color: #38BDF8;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.5);
      overflow-x: auto;
    }

    .output-box table { color: #38BDF8; width: 100%; font-size: .85rem; }
    .output-box th, .output-box td { padding: 6px 10px; border-bottom: 1px solid rgba(255,255,255,.08); text-align: left; }
    .output-box th { color: var(--text-muted); font-weight: 600; }

    /* Navbar */
    .navbar-fusion {
      background: rgba(3, 7, 18, 0.8);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .demo-btn {
      background: rgba(56, 189, 248, 0.12);
      border: 1px dashed rgba(56, 189, 248, 0.4);
      color: #38BDF8 !important;
      border-radius: 14px;
      font-weight: 600;
      padding: 0.9rem 1.8rem;
      transition: all 0.25s ease;
    }
    .demo-btn:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: #38BDF8;
      transform: translateY(-2px);
    }
    .home-fab {
      position: fixed;
      bottom: 24px;
      left: 24px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--gradient-ml);
      color: #fff !important;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      text-decoration: none;
      box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.5);
      z-index: 1500;
      transition: transform 0.25s ease;
    }
    .home-fab:hover { transform: translateY(-4px) scale(1.05); }
  </style>
</head>
<body>

  <!-- Background Orbs -->
  <div class="bg-mesh">
    <div class="orb-1"></div>
    <div class="orb-2"></div>
  </div>

  <!-- Header Navigation -->
  <nav class="navbar navbar-expand-lg navbar-fusion py-3 mb-4">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2 text-decoration-none" href="{{ url_for('home') }}">
        <div class="p-2 rounded-3 text-white d-flex align-items-center justify-content-center" style="background: var(--gradient-ml); width: 38px; height: 38px;">
          <i class="fa-solid fa-brain fs-6"></i>
        </div>
        <span class="fw-bold fs-4 text-white" style="font-family: var(--font-display); letter-spacing: -0.5px;">
          ML <span class="gradient-text">×</span> MATH
        </span>
      </a>
      <div class="ms-auto d-flex align-items-center gap-3">
        <span class="fusion-badge"><i class="fa-solid fa-bolt text-warning"></i> ENGINE ONLINE</span>
        <a href="{{ url_for('home') }}" class="btn btn-fusion-secondary btn-sm px-3">Console</a>
      </div>
    </div>
  </nav>

  <main class="container py-3">
    {% block content %}{% endblock %}
  </main>

  <footer class="text-center py-5 text-secondary border-top border-secondary border-opacity-10 mt-5 small">
    <div class="container">
      <ul class="list-unstyled d-flex flex-wrap justify-content-center gap-3 mb-3">
        <li><a href="{{ url_for('linear_regression_page') }}" class="text-secondary text-decoration-none">Linear Regression</a></li>
        <li><a href="{{ url_for('kmeans_page') }}" class="text-secondary text-decoration-none">K-Means Clustering</a></li>
        <li><a href="{{ url_for('knn_page') }}" class="text-secondary text-decoration-none">K-Nearest Neighbors</a></li>
        <li><a href="{{ url_for('logistic_regression_page') }}" class="text-secondary text-decoration-none">Logistic Regression</a></li>
      </ul>
      <p class="mb-0" style="font-family: var(--font-mono);">&copy; 2026 Machine Learning × Mathematics Computational Engine</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
